- name: create ec2 and r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-003ebd2f935aefa8e
    ami_id: ami-0220d79f3f480ecf5
    domain_name: rbskdaws.online
    env: dev
    action: create
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{sg_id}}"
      image_id: "{{ami_id}}"
      name: "{{item}}"
      tags:
        Project: roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env}}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the output
    ansible.builtin.debug:
      msg : "{{ ec2_output}}"